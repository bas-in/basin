[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "basin-sdk"
version = "0.1.0"
description = "Python client for Basin's REST, auth, realtime, functions, and storage HTTP surfaces."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["httpx>=0.24"]

[project.optional-dependencies]
arrow = ["pyarrow>=12"]
realtime = ["websockets>=10"]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
    "respx>=0.20",
    "pyarrow>=12",
    "websockets>=10",
]

[project.urls]
Repository = "https://github.com/basin-db/basin"

[tool.hatch.build.targets.wheel]
packages = ["basin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
