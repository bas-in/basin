# .goreleaser.yaml — basin CLI release pipeline.
#
# Triggered by `git push --tags v*`. Builds multi-arch binaries,
# packages tarballs/zips, generates a SHA256 manifest, and updates the
# `Formula/basin.rb` file in bas-in/homebrew-tap. The release job in
# .github/workflows/release.yml feeds GORELEASER_TOKEN with a fine-grained
# GitHub PAT that has `contents: write` on this repo + `bas-in/homebrew-tap`.

version: 2

project_name: basin

before:
  hooks:
    - go mod tidy

builds:
  - id: basin
    main: .
    binary: basin
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.buildDate={{.Date}}
      - -X main.buildOSArch={{.Os}}_{{.Arch}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

# ── Sigstore keyless signing ─────────────────────────────────────────
# Every archive + checksums.txt gets a detached Sigstore signature
# (.sig) and certificate (.pem) signed by the GitHub Actions OIDC
# identity. No private keys — the signing identity is
# `https://github.com/bas-in/basin-cli/.github/workflows/release.yml@refs/tags/<tag>`,
# which downstream users verify against. The workflow grants
# `id-token: write` so cosign can mint the OIDC token; `--yes` skips
# the interactive prompt that cosign normally shows for non-CI runs.
# See README §"Verifying release signatures" for the verify-blob
# command operators run on download.
signs:
  - id: cosign-keyless
    cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--yes"
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
    artifacts: all
    output: true

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"

# ── Docker (GHCR) ─────────────────────────────────────────────────────
# Pushes one multi-arch image per release tag to
# `ghcr.io/bas-in/basin:<version>` + `:latest`. The image is a
# single-binary install — the CLI is a static Go binary; no runtime
# deps inside the container.
#
# Gated on `DOCKER_REGISTRY_USER` + `DOCKER_REGISTRY_PASS` (or the
# matching `GITHUB_TOKEN` permissions in CI). Goreleaser uses
# buildx for amd64+arm64 fan-out; the build pulls the static
# `gcr.io/distroless/static-debian12:nonroot` base, copies the binary
# in, and ships nonroot by default. Operators can pull via:
#
#   docker run --rm ghcr.io/bas-in/basin:latest version
#
# The `image_templates` list pins both the SHA-style + the moving
# `:latest` tag so production callers can pin a digest while smoke
# tests run against latest. `use: buildx` is required to emit a
# multi-arch manifest list rather than per-arch images.
dockers:
  - id: basin-amd64
    image_templates:
      - "ghcr.io/bas-in/basin:{{ .Version }}-amd64"
    use: buildx
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title=basin"
      - "--label=org.opencontainers.image.description=Basin Cloud control plane CLI"
      - "--label=org.opencontainers.image.url=https://basin.run"
      - "--label=org.opencontainers.image.source=https://github.com/bas-in/basin-cli"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"
  - id: basin-arm64
    image_templates:
      - "ghcr.io/bas-in/basin:{{ .Version }}-arm64"
    use: buildx
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title=basin"
      - "--label=org.opencontainers.image.description=Basin Cloud control plane CLI"
      - "--label=org.opencontainers.image.url=https://basin.run"
      - "--label=org.opencontainers.image.source=https://github.com/bas-in/basin-cli"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"

# Manifest list combining the per-arch images into the canonical
# `:<version>` + `:latest` tags so `docker pull ghcr.io/bas-in/basin`
# Just Works regardless of the consumer's arch.
docker_manifests:
  - name_template: "ghcr.io/bas-in/basin:{{ .Version }}"
    image_templates:
      - "ghcr.io/bas-in/basin:{{ .Version }}-amd64"
      - "ghcr.io/bas-in/basin:{{ .Version }}-arm64"
  - name_template: "ghcr.io/bas-in/basin:latest"
    image_templates:
      - "ghcr.io/bas-in/basin:{{ .Version }}-amd64"
      - "ghcr.io/bas-in/basin:{{ .Version }}-arm64"

# ── Homebrew tap ─────────────────────────────────────────────────────
# Writes / updates Formula/basin.rb in bas-in/homebrew-tap on every
# release. Operators then `brew install bas-in/tap/basin` to get the
# binary on macOS/Linux.
brews:
  - name: basin
    repository:
      owner: bas-in
      name: homebrew-tap
      branch: main
    homepage: https://basin.run
    description: Basin Cloud control plane CLI
    license: Apache-2.0
    test: |
      system "#{bin}/basin", "--version"
    install: |
      bin.install "basin"

# ── Scoop bucket (Windows) ───────────────────────────────────────────
# Writes / updates basin.json in bas-in/scoop-bucket on every release.
# Operators then `scoop bucket add bas-in https://github.com/bas-in/scoop-bucket`
# followed by `scoop install basin` to get the Windows binary.
# Disabled until the bucket repo exists + SCOOP_TAP_TOKEN is wired into
# the release workflow — keep `skip_upload: auto` so a release with no
# Windows builds (or before the bucket repo lands) doesn't fail.
scoops:
  - name: basin
    repository:
      owner: bas-in
      name: scoop-bucket
      branch: main
    homepage: https://basin.run
    description: Basin Cloud control plane CLI
    license: Apache-2.0
    skip_upload: auto

# ── AUR (Arch User Repository) ───────────────────────────────────────
# Publishes a `basin-bin` PKGBUILD to aur.archlinux.org on every release.
# AUR uses SSH for the git push, so the release workflow needs an
# `AUR_KEY` secret containing the private half of an SSH keypair whose
# public half is registered on the maintainer's AUR account.
# Operators on Arch / Manjaro / EndeavourOS / etc. then:
#   yay -S basin-bin   (or `paru -S basin-bin`)
# `package:` is shell run inside the PKGBUILD's `package()` function —
# goreleaser drops the prebuilt linux-amd64 / linux-arm64 binary into
# `$srcdir`, so a single `install` line is enough.
# Disabled (`skip_upload: auto`) until the user (1) creates an AUR account,
# (2) submits the empty `basin-bin` package once so the SSH git URL
# exists, (3) wires `AUR_KEY` into the release workflow secrets.
aurs:
  - name: basin-bin
    homepage: https://basin.run
    description: Basin Cloud control plane CLI
    maintainers:
      - 'Basin Team <team@basin.run>'
    license: Apache-2.0
    private_key: '{{ .Env.AUR_KEY }}'
    git_url: 'ssh://aur@aur.archlinux.org/basin-bin.git'
    skip_upload: auto
    provides:
      - basin
    conflicts:
      - basin
    package: |-
      install -Dm755 "./basin" "${pkgdir}/usr/bin/basin"
    commit_author:
      name: goreleaserbot
      email: bot@basin.run

release:
  github:
    owner: bas-in
    name: basin-cli
  draft: false
  prerelease: auto
