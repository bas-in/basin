name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # id-token: write is reserved for Sigstore keyless signing via cosign.
  # TODO: re-add cosign signing — wire sigstore/cosign-installer + cosign
  # sign-blob over each uploaded artefact and its checksums.txt, matching
  # what .goreleaser.yaml did. Requires id-token: write here and cosign v2.
  packages: write

jobs:
  build-release:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # cross-linker for aarch64 linux on the amd64 runner
      - name: Install aarch64 cross toolchain (Linux only)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Set CARGO_TARGET env for cross-linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      # taiki-e/upload-rust-binary-action packages, checksums, and uploads
      # the binary to the GitHub release created by the tag push.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: basin
          target: ${{ matrix.target }}
          archive: basin_$tag_$target
          token: ${{ secrets.GITHUB_TOKEN }}

  # Docker image pushed to GHCR (linux amd64 + arm64 manifest list).
  # Mirrors what goreleaser's dockers: + docker_manifests: blocks did.
  docker:
    name: docker (ghcr.io)
    runs-on: ubuntu-latest
    needs: build-release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/bas-in/basin
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Homebrew tap update — pushes an updated Formula/basin.rb to
  # bas-in/homebrew-tap using the GORELEASER_TAP_TOKEN PAT (same secret
  # the old goreleaser pipeline used, kept for continuity).
  # TODO: automate formula generation from checksums.txt once
  # taiki-e/upload-rust-binary-action produces a stable checksums file.
  # For now, update manually after each release or wire a separate action.
