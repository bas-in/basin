[package]
name = "basin-rest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Optional realtime co-mount: SSE + WS handlers on the REST port.
# Enabled by basin-server's `realtime` feature so clients can reach
# /realtime/v1/sse|ws on the same port as /rest/v1/*.
realtime = ["dep:basin-realtime"]

[dependencies]
basin-common.workspace = true
basin-engine.workspace = true
basin-auth.workspace = true
basin-catalog.workspace = true
basin-blob.workspace = true
basin-realtime = { workspace = true, optional = true }

tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
bytes.workspace = true
base64.workspace = true
arrow.workspace = true
arrow-array.workspace = true
arrow-ipc.workspace = true
arrow-schema.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
chrono.workspace = true
# Used to render `FixedSizeBinary(16)` UUID columns as canonical
# hyphenated text in JSON responses (see `json::encode_cell`).
uuid.workspace = true
sha2.workspace = true
hmac.workspace = true
subtle.workspace = true
hex.workspace = true
object_store.workspace = true
# AES-256-GCM for OAuth secret + MFA seed encryption (P0 security fix).
aes-gcm = "0.10"
rand.workspace = true

# HTTP stack.
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
http.workspace = true
hyper.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio-test.workspace = true
basin-storage.workspace = true
object_store.workspace = true
tokio-postgres.workspace = true
ulid.workspace = true
uuid.workspace = true
