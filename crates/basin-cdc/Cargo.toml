[package]
name = "basin-cdc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
basin-common.workspace = true
basin-storage.workspace = true
basin-auth.workspace = true
# Phase 2: the webhook delivery worker reads subscriptions + persists the
# delivery cursor through the catalog, and the CRUD routes mint webhook rows.
# basin-catalog depends only on basin-common, so this edge is acyclic.
basin-catalog.workspace = true

object_store.workspace = true
tokio.workspace = true
async-trait.workspace = true
chrono.workspace = true
tracing.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
bytes.workspace = true
ulid.workspace = true

# Phase 2 webhook delivery: HTTP client for the outbound POST, HMAC-SHA256
# request signing, hex encoding of the signature + minted secret, and a CSPRNG
# for the secret bytes.
reqwest.workspace = true
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true

# Concurrent per-project live-tail broadcast registry. Same major version
# basin-realtime already pins, so no new lock-file resolution.
dashmap = "6"

# HTTP stack for the SSE delivery router (GET /cdc/v1/:project/stream).
# Mirrors basin-realtime's manifest: the `ws` feature is not needed here —
# Phase 1 is SSE-only — so we pull axum without it.
axum.workspace = true

# Phase 3 Kafka sink — production producer transport. PURE-RUST client (no
# librdkafka C dependency: `rskafka` speaks the Kafka wire protocol directly),
# gated behind the `cdc-kafka` feature so the DEFAULT build never links it and
# stays C-toolchain-free. `default-features = false` drops the compression
# codecs (gzip/lz4/snappy/zstd) we do not need — CDC records are JSON v1 and
# Kafka-level compression is not part of Phase 3.
rskafka = { version = "0.6", optional = true, default-features = false }

[features]
# OFF by default. Enables the production `rskafka`-backed Kafka producer + the
# `spawn_kafka_supervisor` convenience constructor. The delivery-worker logic,
# the `KafkaProducer` trait, partition-key derivation, and record framing are
# always compiled (and tested with an in-process mock producer) regardless of
# this flag; only the real transport is gated.
default = []
cdc-kafka = ["dep:rskafka"]

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tempfile.workspace = true
basin-catalog.workspace = true
basin-engine.workspace = true
