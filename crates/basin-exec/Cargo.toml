[package]
name = "basin-exec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The physical execution layer. arrow supplies every compute kernel — filter,
# take, sort, compare, hash, cast — so what lives here is orchestration, not
# vectorised primitives. That distinction is why the layer is ~10k lines rather
# than DataFusion's 57k (docs/migration/df-removal/03-physical-operators.md).
#
# No DataFusion. No storage yet: the scan operator takes batches from a trait so
# operators can be tested without object storage.
[dependencies]
basin-pgtype = { workspace = true }
basin-plan = { workspace = true }
arrow = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
arrow-select = { workspace = true }
