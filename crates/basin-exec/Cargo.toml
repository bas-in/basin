[package]
name = "basin-exec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The physical execution layer. arrow supplies every compute kernel — filter,
# take, sort, compare, hash, cast — so what lives here is orchestration, not
# vectorised primitives. That distinction is why the layer is ~10k lines rather
# than DataFusion's 57k (docs/migration/df-removal/03-physical-operators.md).
#
# No DataFusion. The scan operator takes batches from a trait (`BatchSource`)
# so every operator except `storage_source` can be tested without object
# storage. `storage_source` is the one module allowed to depend on
# `basin-storage` (plus the tokio/futures plumbing needed to drive its async
# read path) — see that module's docs for why the dependency is confined
# there instead of leaking into `scan.rs` or `build.rs`.
[dependencies]
basin-pgtype = { workspace = true }
basin-plan = { workspace = true }
basin-common = { workspace = true }
basin-storage = { workspace = true }
arrow = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
arrow-select = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
object_store = { workspace = true }
tempfile = { workspace = true }
# `tests/function_equivalence.rs` diffs every scalar function `eval.rs`
# implements against a live PostgreSQL 18 (PG_DIFF_TEST_DSN, same convention
# as crates/basin-pgcatalog/tests/catalog_fidelity.rs and
# crates/basin-engine/tests/differential_pg.rs). Dev-only: a Postgres client
# must never reach this crate's production dependency graph — `tokio` itself
# is already a normal dependency (see the module docs above), only the
# Postgres wire client is confined to dev-dependencies.
tokio-postgres = { workspace = true }

# `function_equivalence` is `harness = false` for the same reason
# `catalog_fidelity` is (see that file's module docs): a skip (no
# PG_DIFF_TEST_DSN) must print an explicit banner every run, not silently
# look identical to "1 passed" the way libtest's default captured-stdout
# summary would.
[[test]]
name = "function_equivalence"
path = "tests/function_equivalence.rs"
harness = false

# `tests/orphan_functions.rs` is `function_equivalence`'s complement: it diffs
# the pg_catalog functions Basin answers today ONLY because DataFusion's
# builtin registry answers them — no Basin code on either side, so nothing a
# grep of "what Basin registers" can find, and they vanish the moment
# `datafusion = "53"` is deleted (Cargo.toml:149). See that file's module docs
# for the census and its limits. It is EXPECTED TO FAIL until the re-hosting
# tranche lands; the failure output is the work queue.
#
# `harness = false` for the same reason as above: the no-DSN skip must print a
# banner every run rather than look like a pass.
[[test]]
name = "orphan_functions"
path = "tests/orphan_functions.rs"
harness = false
