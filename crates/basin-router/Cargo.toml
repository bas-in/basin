[package]
name = "basin-router"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
basin-common.workspace = true
basin-engine.workspace = true
basin-pool.workspace = true
basin-auth.workspace = true
serde_json.workspace = true

# Multi-statement simple-query messages (`tokio_postgres::batch_execute`,
# `psql -f setup.sql`) need to be split into individual statements before
# dispatch to the engine, which accepts one statement per call. We use
# sqlparser's tokenizer to find top-level `;` separators correctly across
# dollar-quoted bodies, single-/double-quoted literals, and SQL comments.
sqlparser.workspace = true

tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
bytes.workspace = true
arrow.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
chrono.workspace = true
pgwire.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Used by remote_shard.rs to forward pgwire traffic from the front router
# to a chosen shard owner's pgwire listener. Same client crate the test
# suite already uses; promoting it from dev-dep to regular dep keeps
# pgwire types consistent across the route.
tokio-postgres.workspace = true
# test_cluster helpers need a tempdir for the shared on-disk LocalFS, and
# integration tests reach in via `pub mod test_cluster`. Keeping it as a
# regular dep avoids feature-gating gymnastics for what is already a small
# dev-quality helper.
tempfile.workspace = true
object_store.workspace = true
basin-storage.workspace = true
basin-catalog.workspace = true
# Used to render 16-byte FixedSizeBinary UUID columns as canonical
# hyphenated text (Postgres OID 2950) on both the simple-query and
# extended-query response paths. See `types::render_uuid`.
uuid.workspace = true
# Per-project pgwire rate limiter (`rate_limit.rs`) — same crate basin-net
# uses for outbound HTTP throttling, keeping the limiter implementation
# uniform across both protocols.
governor.workspace = true
# pgwire 0.28's `process_socket` already does the SSLRequest peek + 'S'/'N'
# response when handed a TlsAcceptor; we just need to construct one from
# PEM material in `tls.rs`. Versions match what pgwire pulls in transitively
# so we reuse the same compiled rustls / aws-lc-rs.
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12", "logging"] }
rustls-pemfile = "2"

[dev-dependencies]
tokio-test.workspace = true
# JWT resolver tests stand up a live `AuthService` against PG; ulid
# deps mirror what basin-auth's own tests use for the per-test schema
# guard and the test issuer.
ulid.workspace = true
# Self-signed cert generation for the TLS handshake test in `src/tls.rs`
# and `tests/tls_handshake.rs`. Test-only, so no workspace promotion.
rcgen = "0.13"
