[package]
name = "basin-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Default: full HTTP layer + Basin-table-backed `ResponseStore`. Toggle
# off (`default-features = false`) from upstream consumers that only
# need `HttpClient`, to avoid pulling `basin-engine` into the dep graph.
# basin-webhooks enables this when its `delivery` feature is on.
default = ["engine-store"]
# When enabled, exposes `ResponseStore` (which keeps response rows in
# Basin tables via `basin-engine`) and the request queue. Disable to
# break basin-net -> basin-engine and prevent the
# basin-engine -> basin-webhooks -> basin-net -> basin-engine cycle
# in compile slices that don't need the response store.
engine-store = ["dep:basin-engine"]

[dependencies]
basin-common.workspace = true
basin-catalog.workspace = true
basin-engine = { workspace = true, optional = true }

tokio.workspace = true
async-trait.workspace = true
chrono.workspace = true
tracing.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
governor.workspace = true
arrow-array.workspace = true

# HTTP client. `rustls-tls` keeps us off OpenSSL system libraries, matching
# `lettre`'s tokio1-rustls-tls choice in basin-auth. `json` enables the
# `.json::<T>()` helper. `gzip`/`brotli` left off — Basin doesn't decompress
# user payloads on the way back into SQL.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# URL parsing for allowlist host checks. Already pulled in transitively via
# reqwest, pinning at a stable major.
url = "2"

[dev-dependencies]
tempfile.workspace = true
basin-storage.workspace = true
arrow.workspace = true
arrow-schema.workspace = true
object_store.workspace = true
tokio = { workspace = true, features = ["full"] }
