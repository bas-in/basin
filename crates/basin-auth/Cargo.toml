[package]
name = "basin-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Expose `basin_auth::store::conformance` to external test suites (e.g.
# services/basin-server/src/engine_auth_store.rs #[cfg(test)]). Never
# enabled in production builds.
test-utils = []

[dependencies]
basin-common.workspace = true
basin-catalog.workspace = true

tokio.workspace = true
async-trait.workspace = true
tracing.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
ulid.workspace = true
uuid.workspace = true

# Auth-specific deps (pinned at workspace level).
lettre = { workspace = true, features = ["tokio1", "tokio1-rustls-tls"] }
jsonwebtoken.workspace = true
bcrypt.workspace = true
governor.workspace = true

# Postgres-backed auth schema. TLS via rustls so managed providers that
# mandate `sslmode=require` (Neon, RDS, Supabase, Crunchy) work; the
# `MakeRustlsConnect` connector falls through to plaintext when the server
# answers `N` to the SSLRequest, so intra-VPC plaintext (e.g. Fly 6PN PG)
# still works through the same call site.
tokio-postgres = { workspace = true, features = ["with-serde_json-1", "with-chrono-0_4", "with-uuid-1"] }
tokio-postgres-rustls = "0.13"
# rustls 0.23 + aws-lc-rs to match the provider basin-router already installs
# process-wide; webpki-roots ships the Mozilla trust bundle so we don't lean
# on the host's system trust store inside slim container images.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "tls12", "logging"] }
webpki-roots = "1.0"

# Crypto helpers: sha256 of opaque tokens before storing, constant-time
# comparison via `subtle`, hex encoding for token wire format. All transitive
# dependencies of crates we already pull in, so they cost us nothing extra.
sha2 = "0.10"
subtle = "2"
hex = "0.4"
rand = "0.8"
# Url-safe base64 for the long-lived API-key wire format. Pulled at the
# workspace level for the engine's `decode()` UDF, so this adds no new
# transitive surface.
base64.workspace = true

# OAuth 2.0 / OIDC (Phase 5.10.O — ADR 0020).
# reqwest: HTTP client for OIDC discovery + token exchange + userinfo.
# hmac: HMAC-SHA256 signing for the CSRF state parameter.
# url: strict-origin validation for redirect_to allowlist (audit P1-3).
reqwest = { workspace = true }
hmac = { workspace = true }
url = "2"

# MFA (Phase 5.10.M — ADR 0020).
# base32: RFC4648 encoding for TOTP shared secrets (otpauth:// URI format).
# sha1: RFC 6238 TOTP requires SHA1-HMAC (interoperability with authenticator apps).
base32 = "0.4"
sha1 = { workspace = true }

# WebAuthn / FIDO2 (Phase 6.SEC.P0.2). Real assertion + attestation crypto:
# - p256: pure-Rust NIST P-256 ECDSA verification of the authenticator
#   signature over `authenticatorData || sha256(clientDataJSON)` (COSE alg -7).
# - ciborium: CBOR decode of the attestation object + COSE public key. Both
#   are pure-Rust (no openssl), Apache-2.0/MIT, and avoid the heavy
#   `webauthn-authenticator-rs` softpasskey path (which drags in openssl).
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
ciborium = "0.2"

[dev-dependencies]
tempfile.workspace = true
tokio-test.workspace = true
# Software authenticator fixture for WebAuthn tests: signs assertions with a
# generated P-256 key so the verification path can be exercised end-to-end.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
rand_core = "0.6"
