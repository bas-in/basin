[package]
name = "basin-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
basin-common.workspace = true
basin-catalog.workspace = true
basin-vector.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
bytes.workspace = true
arrow.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
arrow-select.workspace = true
parquet.workspace = true
object_store.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
ulid.workspace = true
chrono.workspace = true
lru.workspace = true
# Disk-cache key hashing: SHA-256 of `(path, range)` is plenty for cache
# keying (we don't need cryptographic strength, just collision resistance
# on a content-addressed namespace). sha2 is already a transitive workspace
# dep via basin-auth, so this costs no extra build time.
sha2 = "0.10"
hex = "0.4"
# AES-256-GCM for envelope encryption of Parquet bodies (Phase 6 BYO-key
# hooks). 0.10.x is the audited, allocation-light line; the wrapping
# `EncryptionProvider` trait is what real KMS adapters plug into, this
# crate just orchestrates the symmetric leg.
aes-gcm = "0.10"
# Random nonces for AES-GCM. `rand` is already a workspace test dep; we
# pull it as a runtime dep here so production builds get a real CSPRNG
# (`OsRng` via `thread_rng`) without per-callsite plumbing.
rand.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio-test.workspace = true
