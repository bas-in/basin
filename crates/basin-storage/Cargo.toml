[package]
name = "basin-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
basin-common.workspace = true
basin-catalog.workspace = true
basin-sketch.workspace = true
basin-vector.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
bytes.workspace = true
arrow.workspace = true
arrow-array.workspace = true
arrow-buffer = "58"
arrow-schema.workspace = true
arrow-select.workspace = true
parquet.workspace = true
object_store.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
ulid.workspace = true
chrono.workspace = true
lru.workspace = true
# Disk-cache key hashing: SHA-256 of `(path, range)` is plenty for cache
# keying (we don't need cryptographic strength, just collision resistance
# on a content-addressed namespace). sha2 is already a transitive workspace
# dep via basin-auth, so this costs no extra build time.
sha2 = "0.10"
hex = "0.4"
# AES-256-GCM for envelope encryption of Parquet bodies (Phase 6 BYO-key
# hooks). 0.10.x is the audited, allocation-light line; the wrapping
# `EncryptionProvider` trait is what real KMS adapters plug into, this
# crate just orchestrates the symmetric leg.
aes-gcm = "0.10"
# Random nonces for AES-GCM. `rand` is already a workspace test dep; we
# pull it as a runtime dep here so production builds get a real CSPRNG
# (`OsRng` via `thread_rng`) without per-callsite plumbing.
rand.workspace = true
# UUID coercion in the predicate evaluator: `ScalarValue::Utf8` (canonical
# hyphenated form) → 16-byte `FixedSizeBinary` before byte comparison.
uuid = { workspace = true }
# Vortex columnar storage format (#161 — opt-in `WITH (basin.file_format =
# 'vortex')`). Versions pinned to match the proven benchmark/vortex_compare
# crate; vortex 0.71 targets arrow 58 (= the workspace pin) exactly.
# 0.71 fixes Arrow field-level metadata stripping (ADR-0024 BASIN_TYPE sidecar).
vortex-array = "0.71"
vortex-file = { version = "0.71", features = ["zstd"] }
vortex-btrblocks = { version = "0.71", features = ["zstd", "pco"] }
vortex-session = "0.71"
vortex-io = { version = "0.71", features = ["tokio"] }
vortex-layout = "0.71"
vortex-buffer = "0.71"
# Per-file bloom filters for point_eq miss-path pruning (Phase 5.14.A2/A3).
# fastbloom 0.7.x: block-Bloom implementation with Hash-based insert/contains;
# serialises via as_slice() (Vec<u64>) — stable across restarts on the same
# platform (little-endian u64, deterministic DefaultHasher seed).
fastbloom = "0.7"

[dev-dependencies]
tempfile.workspace = true
tokio-test.workspace = true
