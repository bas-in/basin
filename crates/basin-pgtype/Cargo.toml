[package]
name = "basin-pgtype"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Deliberately minimal. This crate is the thing 249 UDFs, the catalog, the wire
# protocol and the planner all have to agree on, so it sits at the bottom of the
# dependency graph and stays there. `arrow-schema` is the only dependency
# because the physical mapping has to name Arrow types; nothing here needs Arrow
# *data*, and nothing here may depend on basin-engine, DataFusion, or storage.
# See docs/migration/df-removal/08-ir-design.md §1.
[dependencies]
arrow-schema = { workspace = true }

# Dev-only: `tests/type_matrix.rs` is a differential harness that checks this
# crate's cast/operator/type tables against a LIVE PostgreSQL when
# `PG_DIFF_TEST_DSN` is set, following the same DSN convention as
# `crates/basin-engine/tests/differential_pg.rs` and
# `tests/integration/tests/differential_pg.rs`. It skips cleanly (and loudly)
# without a configured server, so this stays test-only — see that crate's
# Cargo.toml comment for the same justification.
[dev-dependencies]
tokio = { workspace = true }
tokio-postgres = { workspace = true }
