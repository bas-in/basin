[package]
name = "basin-geo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
basin-common.workspace = true

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# `geo` 0.33 provides `LineString` / `Polygon` value types and the
# planar geometric primitives we use for ray-casting and segment-distance
# math (`ST_Contains` polygon-point, `ST_Distance` LineString variants).
# We deliberately *don't* use `geo`'s `Area` / `Length` traits — those
# are planar / Cartesian and would silently drop us into degree-units
# accuracy near the poles. WGS84-correct surface-area and great-circle
# arc length are computed directly in this crate against `EARTH_RADIUS_M`.
# Pinned via workspace deps so basin-engine sees the same version
# (avoids the previous 0.28-in-workspace + 0.33-in-basin-geo duplicate-
# version compile).
geo.workspace = true

# Pure-Rust PROJ4 backing `transform::st_transform`. See workspace
# Cargo.toml for the rationale (no native deps, no NTv2 datum grids).
proj4rs.workspace = true

[dev-dependencies]
