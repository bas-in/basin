[package]
name = "basin-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
basin-common.workspace = true
basin-storage.workspace = true
basin-catalog.workspace = true
basin-vector.workspace = true
# PostGIS-shape spatial layer. Engine depends on basin-geo for:
# - POINT column physical type (`FixedSizeBinary(POINT_WKB_LEN)`)
# - ST_MakePoint / ST_X / ST_Y / ST_Distance / ST_DWithin / ST_AsText etc.
#   scalar UDFs registered from `geo_glue::install_udfs`.
# basin-geo has no dependency on basin-engine, so this is dependency-cycle-
# free (basin-geo -> basin-common only).
basin-geo.workspace = true
basin-shard.workspace = true
basin-wal.workspace = true
basin-hottier.workspace = true
basin-sketch.workspace = true
xxhash-rust = { workspace = true }

tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
arrow.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
arrow-select.workspace = true
parquet.workspace = true
bytes.workspace = true
datafusion.workspace = true
# Vortex DataFusion integration (#162 — read path for opt-in Vortex tables).
# 0.71 targets datafusion 53 / arrow 58 = the workspace pins exactly.
# 0.71 fixes Arrow field-level metadata stripping (ADR-0024 BASIN_TYPE sidecar).
vortex-datafusion = "0.71"
# vortex core — needed by vortex_listing_format (W2-1) to call
# VortexSession::default() and to name types in BasinVortexFormat.
# Already a transitive dep of vortex-datafusion 0.71.
vortex = "0.71"
# Sub-crates used by vortex_listing_format's FileFormat impl; they must be
# direct deps to name their types in method signatures.  Versions match the
# datafusion = "53" workspace entry exactly.
datafusion-datasource = "53"
datafusion-physical-expr = "53"
datafusion-physical-plan = "53"
datafusion-session = "53"
sqlparser.workspace = true
object_store.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
# SIMD JSON parse on the bulk-INSERT JSONB hot path (`coerce_jsonb`).
# Parses straight into `serde_json::Value` so the existing canonicalisation
# (BTreeMap key-sort, semantic-preserving) is reused unchanged.
sonic-rs.workspace = true
uuid.workspace = true
url = "2"
chrono.workspace = true

# UUID + pgcrypto-shaped UDFs. See basin_engine::udf for digest()/encode()/
# decode()/crypt()/gen_salt(). All 0.10-line `digest`-trait shaped so a
# single `Digest` bound dispatches to whichever algo the user picked.
sha1 = { workspace = true }
sha2 = { workspace = true }
md-5 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
bcrypt = { workspace = true }
# Regex engine for regexp_match / regexp_split_to_array UDFs.
regex.workspace = true
# Phase 5.8.A: cron.schedule / cron.unschedule UDFs need cron-expr validation.
cron = "0.12"
# Phase 5.8.A: net.http_get / net.http_post UDFs — same lib as basin-net.
reqwest.workspace = true
# `WebhookOps` (5.11.I) is a bitflags struct stored on the engine-local
# `webhook_registry` module after the cycle-fix moved registry types out
# of basin-webhooks.
bitflags = "2"
# Real PostgreSQL 16 parser (libpg_query vendored). ADR 0014 Phase 1 canonical
# parser. Classifies every statement before sqlparser sees it; the noop-accept
# dispatch intercepts admin/RBAC/FDW/transaction statements and returns an
# empty result without touching the sqlparser pipeline.
pg_query.workspace = true
# Phase 5.11.J: LANGUAGE wasm UDFs. wasmtime provides the WASM runtime with
# sandboxing (epoch-based CPU caps + linear-memory limits) by construction.
wasmtime = { version = "44", default-features = true }
# Phase 5.16.B: per-shape HDR histograms.
# hdrhistogram — low-overhead latency/count histograms with bounded memory.
hdrhistogram = "7"
# dashmap — concurrent sharded HashMap; one shard per project, zero contention
# across project boundaries.  Version 6 matches basin-hottier.
dashmap = "6"
# lru — bounded LRU cache; one per project, capped at 500 distinct shapes so
# idle projects cost O(bytes) not O(shapes).
lru.workspace = true
# Snowball English stemmer for FTS to_tsvector (Phase 5.20.C).
rust-stemmers.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio-test.workspace = true
# simd-json — SIMD-accelerated JSON parser (port of simdjson). Evaluated as a
# faster replacement for serde_json in the JSONB parse hot path
# (jsonb_udf::jsonb_to_value) but NOT adopted: it mutates its input in place
# (forcing a buffer copy of the read-only stored bytes) and still builds the
# same serde_json::Value tree, so the win was only ~1.03x at ~2KB / ~1.14x at
# ~62KB. Kept as a dev-dep solely so the opt-in `bench_simd_vs_serde_parse`
# micro-benchmark and the `jsonb_parse_parity` cross-check stay reproducible.
simd-json = "0.17"
# wasm_udf unit tests compile WAT text to WASM bytes via the `wat` crate.
# `wat` is already a transitive dep of `wasmtime` (the `wat` feature is
# enabled by default) so no extra network download is required.
wat = "1"
# 5.11.I integration tests in `tests/alter_table_dml_surfaces.rs` exercise
# the HTTP delivery side of webhook subscriptions (RetryQueue / WebhookSink
# / WebhookConfig) and need `basin-webhooks` with its default `delivery`
# feature. The registry + DDL-matcher types live in `basin-engine` directly
# (see `webhook_registry.rs` / `webhook_ddl.rs`), so this dev-dep is not a
# cycle: the prod graph here is engine -> {registry, ddl}; webhooks ->
# basin-net -> engine; webhooks is only seen as a dev-dep at test time.
basin-webhooks.workspace = true
chrono.workspace = true
serde_json.workspace = true
# Differential harness (`tests/differential_pg.rs`) replays identical SQL
# against a real PostgreSQL when `PG_DIFF_TEST_DSN` is set; without the env
# var the cases skip cleanly so this stays test-only.
tokio-postgres.workspace = true
# Benchmarks (query_stats_overhead.rs, Phase 5.16.B).
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "query_stats_overhead"
harness = false
