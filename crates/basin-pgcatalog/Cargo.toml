[package]
name = "basin-pgcatalog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# pg_catalog as real relations, not `TableProvider` shims. The point of this
# crate is a shape that can push a predicate into the catalog query instead of
# materializing a whole relation and filtering afterward — see
# docs/migration/df-removal/11-pg-catalog-fidelity.md §1. Deliberately
# minimal: basin-pgtype for the OID/type tables, arrow-array/arrow-schema for
# the RecordBatch every relation returns. No DataFusion, no basin-storage, no
# tokio — a catalog relation must be describable without reference to how or
# where it runs.
[dependencies]
basin-pgtype = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }

# Dev-only: `real_source.rs`'s test suite builds a real `basin-catalog`
# (backed by a local-filesystem object store in a TempDir) to prove the
# CatalogSource pushdown contract against real data, not only the mock. Kept
# out of [dependencies] deliberately: `basin-catalog` unconditionally pulls
# tokio/tokio-postgres/reqwest, which would defeat the point of this crate
# staying tokio-free for every non-test consumer. See real_source.rs's module
# docs for the full reasoning.
[dev-dependencies]
basin-catalog = { workspace = true }
basin-common = { workspace = true }
object_store = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
# `tests/catalog_fidelity.rs` diffs every relation's declared arrow_schema()
# against a live PostgreSQL's real pg_attribute layout (PG_DIFF_TEST_DSN,
# same convention as crates/basin-engine/tests/differential_pg.rs). Dev-only:
# a postgres client must never reach this crate's production dependency
# graph (arrow-array, arrow-schema, basin-pgtype only — see this file's own
# module docs above).
tokio-postgres = { workspace = true }

# `catalog_fidelity` is `harness = false` so its output is never captured
# and hidden on success the way a normal `#[test]`'s stdout is — a skip (no
# PG_DIFF_TEST_DSN) must print an explicit banner every run, not silently
# look identical to "1 passed" the way libtest's default summary would (see
# scripts/check-differential.sh's module docs for why that distinction
# matters).
[[test]]
name = "catalog_fidelity"
path = "tests/catalog_fidelity.rs"
harness = false
