[package]
name = "basin-pgcatalog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# pg_catalog as real relations, not `TableProvider` shims. The point of this
# crate is a shape that can push a predicate into the catalog query instead of
# materializing a whole relation and filtering afterward — see
# docs/migration/df-removal/11-pg-catalog-fidelity.md §1. Deliberately
# minimal: basin-pgtype for the OID/type tables, arrow-array/arrow-schema for
# the RecordBatch every relation returns. No DataFusion, no basin-storage, no
# tokio — a catalog relation must be describable without reference to how or
# where it runs.
[dependencies]
basin-pgtype = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }

# Dev-only: `real_source.rs`'s test suite builds a real `basin-catalog`
# (backed by a local-filesystem object store in a TempDir) to prove the
# CatalogSource pushdown contract against real data, not only the mock. Kept
# out of [dependencies] deliberately: `basin-catalog` unconditionally pulls
# tokio/tokio-postgres/reqwest, which would defeat the point of this crate
# staying tokio-free for every non-test consumer. See real_source.rs's module
# docs for the full reasoning.
[dev-dependencies]
basin-catalog = { workspace = true }
basin-common = { workspace = true }
object_store = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
