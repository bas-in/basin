[package]
name = "basin-plan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Basin's own logical IR. Deliberately thin on dependencies: the IR must be
# describable without reference to how it is executed or where the data lives.
# No DataFusion, no storage, no tokio. `basin-pgtype` supplies the type system;
# `arrow-schema` is needed only to describe a relation's output schema.
# See docs/migration/df-removal/08-ir-design.md §1.
[dependencies]
basin-pgtype = { workspace = true }
arrow-schema = { workspace = true }
# Real PostgreSQL parser (libpg_query), used by `lower` to turn a pg_query
# parse tree into this crate's `Expr`/`LogicalPlan`. See
# docs/decisions/0030-own-query-engine-remove-datafusion.md — this is the
# dependency that replaces basin-engine's 9,546-line string-rewriting
# `pg_operators.rs`.
pg_query = { workspace = true }
