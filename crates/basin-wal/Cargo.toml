[package]
name = "basin-wal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
basin-common.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
bytes.workspace = true
object_store.workspace = true
serde.workspace = true
serde_json.workspace = true
bincode.workspace = true
ulid.workspace = true
chrono.workspace = true
tracing.workspace = true
thiserror.workspace = true

# Raft consensus for `RaftWal`. Pinned at 0.9 (latest stable line); 0.10 is
# pre-release alpha. `serde` feature lets entries / vote / membership data
# round-trip through bincode-friendly storage. See `RAFT.md` for the
# library-choice ADR. v0.1 ships single-process simulation; cross-process
# gRPC `RaftNetwork` is a follow-up.
openraft = { version = "=0.9.24", features = ["serde"] }

[dev-dependencies]
tempfile.workspace = true
tokio-test.workspace = true
# Tests reach into raft types (BasicNode for membership bootstrap).
openraft = { version = "=0.9.24", features = ["serde"] }
