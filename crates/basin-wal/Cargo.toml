[package]
name = "basin-wal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
basin-common.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
# `serde` feature: `EntryRecord.payload` is a refcounted `Bytes` that must
# serialize through bincode identically to the historical `Vec<u8>` (u64 LE
# length + raw bytes under bincode 1.x fixint). See `segment.rs` wire tests.
bytes = { workspace = true, features = ["serde"] }
object_store.workspace = true
serde.workspace = true
serde_json.workspace = true
bincode.workspace = true
ulid.workspace = true
chrono.workspace = true
tracing.workspace = true
thiserror.workspace = true

# Raft consensus for `RaftWal`. Pinned at 0.9 (latest stable line); 0.10 is
# pre-release alpha. `serde` feature lets entries / vote / membership data
# round-trip through bincode-friendly storage. See `RAFT.md` for the
# library-choice ADR. v0.1 ships single-process simulation; cross-process
# gRPC `RaftNetwork` is the `raft-net` feature (multi-node commit 5).
openraft = { version = "=0.9.24", features = ["serde"] }

# --- raft-net (multi-node commit 5): cross-process gRPC transport ----------
# Feature-gated so the default build (and crates that only need the disk WAL)
# do NOT pull tonic/prost or require `protoc`. The transport lives in
# `src/raft_net`; codegen in `build.rs` is gated on the same feature.
# Versions pinned to what the workspace already resolves transitively
# (opentelemetry pulls tonic 0.12 / prost 0.13) so the lockfile does not gain
# a second major of either. The `tls` feature pulls tokio-rustls (already in
# the workspace lockfile via reqwest/tokio-postgres-rustls), enabling mutual
# TLS on both the Server and Channel — see `raft_net/tls.rs`.
tonic = { workspace = true, optional = true, features = ["tls"] }
prost = { workspace = true, optional = true }
tokio-stream = { workspace = true, optional = true, features = ["net"] }

[features]
# Off by default. Enable with `--features raft-net` (requires `protoc` on the
# build host for `tonic-build`). Tests for the transport are `#![cfg(...)]`
# gated and run under this feature.
raft-net = ["dep:tonic", "dep:prost", "dep:tokio-stream"]

[build-dependencies]
# Only used when the `raft-net` feature is on (build.rs early-returns
# otherwise via CARGO_FEATURE_RAFT_NET). Pinned to match the tonic major.
tonic-build = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
tokio-test.workspace = true
# Tests reach into raft types (BasicNode for membership bootstrap).
openraft = { version = "=0.9.24", features = ["serde"] }
# In-test certificate authority + leaf cert generation for the mTLS transport
# tests (`raft_net_tls.rs`). Pinned to the version the workspace already
# resolves so the lockfile gains no second major. Self-signed CA + per-node
# leaf certs are minted in-process, never committed.
rcgen = "0.13"
