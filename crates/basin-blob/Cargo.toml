[package]
name = "basin-blob"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
basin-common.workspace = true

tokio.workspace = true
async-trait.workspace = true
bytes.workspace = true
object_store.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true

# P2-1: signed-URL rotation secret (BlobSigningSecret uses HMAC-SHA256).
hmac.workspace = true
sha2.workspace = true
subtle.workspace = true

# Postgres-backed BlobCatalog (closes #54 P0). Mirrors basin-catalog's
# deadpool-postgres pool pattern so multi-replica deployments share durable
# blob metadata instead of per-process in-memory state.
deadpool-postgres = "0.14"
tokio-postgres = { workspace = true, features = ["with-serde_json-1", "with-chrono-0_4", "with-uuid-1"] }

[dev-dependencies]
tempfile.workspace = true
tokio-test.workspace = true
