# Dashboard registry.
#
# Each [[dashboard]] becomes one rendered index_<slug>.html. The bundler
# (benchmark/bundle.py) reads this table, picks the matching row by
# data_dir (or renders all rows when no --dir is given), and writes:
#
#   index_<slug>.html  + <data_dir>/results.js  + RESULTS_<slug>.md
#
# To add a new dashboard: copy a block, change the fields, create the
# matching benchmark/<data_dir>/ folder, and re-run bundle.py. No other
# edits required.
#
# Axes:
#   storage_backend  storage substrate the run is hitting
#                    ("localfs" | "seaweedfs" | "r2" | "s3" | "b2" | ...)
#   compute_backend  Basin's compute shape under test
#                    ("single-process" | "multi-shard" | ...)
#   environment      "local" if no network leaves the box, "cloud" otherwise.
#                    Drives the env badge color and the sanity-check that
#                    localfs/seaweedfs are tagged local and r2/s3/b2 cloud.

[[dashboard]]
slug             = "localfs"
storage_backend  = "localfs"
compute_backend  = "single-process"
environment      = "local"
data_dir         = "data"
title            = "Basin — viability and scaling"
h1               = "Basin — LocalFS"
subtitle         = "LocalFS-backed synthetic benchmarks. The fastest, most stable story — no network, no server-side concurrency limits, just the pure architectural numbers.<br><br><strong>Config (Postgres head-to-head cards):</strong> the HTAP DELETE/UPDATE fastpaths are <strong>ON by default</strong> (global kill-switch <code>BASIN_HOTTIER_FASTPATH_DISABLE=1</code> forces the slower cold-tier copy-on-write path — still correct, less performant). Fast bulk-INSERT encoding is also <strong>on by default</strong> for non-transactional INSERTs (no flag needed). Every card runs Basin's default config — no non-default env flags."
footer           = "LocalFS synthetic dashboard. Reads results from <code>benchmark/data/results.js</code>, regenerated by <code>benchmark/bundle.py</code> after each <code>cargo test -p basin-integration-tests</code> run. Open <code>index_localfs.html</code> directly — no server required."

[[dashboard]]
slug             = "real"
storage_backend  = "r2/s3/b2"
compute_backend  = "single-process"
environment      = "cloud"
data_dir         = "data_real"
title            = "Basin — real-cloud benchmarks"
h1               = "Basin — real cloud"
subtitle         = "Same architecture, real S3-compatible backend (Tigris, AWS S3, Cloudflare R2, Backblaze B2, MinIO). These are the numbers your customers will actually experience."
footer           = "Real-cloud dashboard. Reads results from <code>benchmark/data_real/results.js</code>, regenerated by <code>python3 benchmark/bundle.py --dir data_real</code> after each cloud-backed test run. Configure the cloud backend in <code>.basin-test.toml</code> at the repo root."

[[dashboard]]
slug             = "seaweedfs"
storage_backend  = "seaweedfs"
compute_backend  = "single-process"
environment      = "local"
data_dir         = "data_seaweedfs"
title            = "Basin — SeaweedFS benchmarks"
h1               = "Basin — SeaweedFS"
subtitle         = "Same architecture, self-hosted SeaweedFS S3 gateway (multi-volume, designed for high concurrent reads — production proxy for &quot;S3-like&quot; throughput on local hardware)."
footer           = "SeaweedFS dashboard. Reads results from <code>benchmark/data_seaweedfs/results.js</code>, regenerated by <code>python3 benchmark/bundle.py --dir data_seaweedfs</code> after each SeaweedFS-backed test run. Configure the SeaweedFS gateway in <code>.basin-test.seaweedfs.toml</code> at the repo root."

[[dashboard]]
slug             = "three_way"
storage_backend  = "cloud-compare"
compute_backend  = "cloud"
environment      = "cloud"
data_dir         = "data_three_way"
title            = "Basin Cloud — 3-way Frankfurt benchmark"
h1               = "Basin Cloud — Frankfurt 3-way"
subtitle         = "Neon vs Supabase vs Basin Cloud — identical audit-log workload, same region (Frankfurt). Measures Postgres-wire latency and disk cost across three managed cloud offerings."
footer           = "3-way Frankfurt dashboard. Reads results from <code>benchmark/data_three_way/results.js</code>, regenerated by <code>python3 benchmark/bundle.py --dir data_three_way</code> after running <code>benchmark/three_way/run_three_way.sh</code>. See <code>benchmark/three_way/README.md</code> for operator setup."

[[dashboard]]
slug             = "neon"
storage_backend  = "s3"
compute_backend  = "single-process"
environment      = "cloud"
data_dir         = "data_neon"
title            = "Basin v57 vs Neon — cold + warm head-to-head"
h1               = "Basin v57 — vs Neon free tier"
subtitle         = "Basin v57 vs Neon free tier, co-located <code>fra</code> loader, identical workload, <strong>cold and warm both measured</strong> (warm = steady-state p50, cold = first-touch). Honest-comparative: the analytical-scan wins are real, and so are the losses.<br><br><strong>Per-size verdict (warm, win/loss/tie):</strong> 10k = 11/21/2 (Basin loses small-scale point ops), 100k = 17/15/4 (Basin pulls ahead), 1M = 12/11/1 (Basin ahead). <strong>Cold first-touch is loss-heavy at every size</strong> — Basin reads from object storage (Tigris) on the first touch (~25–50ms/file), Neon reads local SSD; the cache helps repeat reads, not the first miss. The cards below isolate Basin's strongest 1M warm scans plus the honest losses.<br><br><strong>Scale (Basin-only — Neon free tier caps at 512MB so it cannot hold these):</strong> narrow_pk 1M seed 230k rows/s (point_lookup 4.1ms, range 4.4ms, full_agg 6.8ms warm); 10M seed 145k rows/s (cold reads climb: point 53.6ms, full_agg 225ms). A narrow_nopk 1B run is in progress — see the scaling card."
footer           = "Basin-vs-Neon dashboard. Reads results from <code>benchmark/data_neon/results.js</code>, regenerated by <code>python3 benchmark/bundle.py --dir data_neon</code>. Numbers are measured p50 latencies (ms) from a co-located Frankfurt loader against Basin v57 and Neon free tier on an identical workload. <code>bare count(*)</code> is served O(1) from Basin's maintained metadata (not a scan) and is labeled as such on its card. The 1B narrow_nopk row is a pending placeholder a human will fill — it is not fabricated."
