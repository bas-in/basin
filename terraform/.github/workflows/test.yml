name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Unit tests ──────────────────────────────────────────────────────────────
  # Runs on every push/PR. Uses the in-process mock cloud; no live backend
  # or BASIN_TOKEN is needed.
  unit:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$files"
            exit 1
          fi

      - name: go build
        run: go build ./...

      - name: go test (unit)
        run: go test ./...

      - name: terraform fmt check (examples)
        uses: hashicorp/setup-terraform@v3
        # Only run if examples/ exists and terraform is available.
        # This step is a best-effort lint; it does not require a backend.
        continue-on-error: false

      - name: terraform fmt -check -recursive examples/
        run: terraform fmt -check -recursive examples/

  # ── Acceptance tests ────────────────────────────────────────────────────────
  # NOT run automatically — requires a live basin-cloud backend and a valid
  # BASIN_TOKEN. Trigger manually or via workflow_dispatch / a separate
  # scheduled workflow.
  #
  # To run locally:
  #   export TF_ACC=1
  #   export BASIN_TOKEN=bso_org_…
  #   export BASIN_TEST_ORG_SLUG=myorg
  #   make testacc
  #
  # acceptance:
  #   name: Acceptance tests
  #   runs-on: ubuntu-latest
  #   if: ${{ vars.RUN_ACC_TESTS == 'true' }}
  #   env:
  #     TF_ACC: "1"
  #     BASIN_TOKEN: ${{ secrets.BASIN_TOKEN }}
  #     BASIN_TEST_ORG_SLUG: ${{ vars.BASIN_TEST_ORG_SLUG }}
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-go@v5
  #       with:
  #         go-version-file: go.mod
  #         cache: true
  #     - name: go test (acceptance)
  #       run: go test ./... -v -timeout 120m
