<!-- Dark-theme variant of basin.svg. Same geometry, paper-toned stroke so the
     mark stays visible on GitHub's dark background, where the ink-on-white
     original reads as a black shape on near-black. Paired with basin.svg via
     <picture> + prefers-color-scheme in README.md. -->
<svg width="240" height="240" viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(340, 340)" fill="none" stroke="#FAF7F0" stroke-width="44" stroke-linecap="round">
    <ellipse cx="0" cy="-110" rx="200" ry="44"/>
    <path d="M -200 -110 Q -200 160, 0 160 Q 200 160, 200 -110"/>
    <circle cx="0" cy="40" r="32" fill="#3B6F73" stroke="none"/>
  </g>
</svg>
