# Phases 5.31.C + 5.31.D — Publish workflow for the Basin Docker image.
# DEPENDENCY: Requires the repo-root Dockerfile produced in Phase 5.31.B.
#             This workflow will fail until that Dockerfile is present.
#
# Triggered on `v*` tag pushes.  Builds a multi-arch image (linux/amd64 +
# linux/arm64), runs the smoke test, then pushes (and cosign-signs) to both
# GHCR and Docker Hub.  `:latest` is applied only to stable releases
# (vX.Y.Z); pre-release tags (vX.Y.Z-rc1 etc.) are tagged by version only.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME — Docker Hub username (account that owns basin/basin-server)
#   DOCKERHUB_TOKEN    — Docker Hub access token for basin/basin-server
#
# GHCR auth uses the built-in ${{ secrets.GITHUB_TOKEN }} — no extra secret needed.

name: Docker Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (e.g. v1.2.3)'
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/vul-os/basin-server
  DHUB_IMAGE: docker.io/basin/basin-server
  # Mirrored into env so steps can test it in an `if:`. The `secrets`
  # context is not dependable inside an expression; `env` is.
  DHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
  BASIN_PORT: 5432

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Build, smoke, and push
  # ──────────────────────────────────────────────────────────────────────────
  build-publish:
    name: Build, smoke & publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required by cosign's keyless signing workflow.
      id-token: write

    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive image tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            # Strip leading 'refs/tags/'
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      # Determine whether this is a stable (non-prerelease) tag so we can
      # conditionally push the :latest alias.
      - name: Check if stable release
        id: stable
        run: |
          version="${{ steps.tag.outputs.version }}"
          if [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is optional and currently unconfigured: this repository has no
      # DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secret, so the login action was
      # being handed two empty strings and failed the whole job in 29 seconds
      # with "Username and password required" — before the image it exists to
      # publish had even been built. GHCR above needs no such secret; it
      # authenticates with the automatic GITHUB_TOKEN, so publishing still
      # happens. Set both secrets and this step starts working again on its own.
      - name: Log in to Docker Hub
        id: dockerhub_login
        if: ${{ env.DHUB_USER != '' }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker metadata (GHCR)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.stable.outputs.is_stable }}

      - name: Build multi-arch image and push to GHCR
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Smoke test against the just-published amd64 image ──────────────────
      - name: Pull image for smoke test (amd64)
        run: |
          docker pull --platform linux/amd64 \
            "$GHCR_IMAGE:${{ steps.tag.outputs.version }}"

      - name: Start Basin container for smoke
        run: |
          docker run -d \
            --name basin-smoke \
            -p "$BASIN_PORT:$BASIN_PORT" \
            --platform linux/amd64 \
            "$GHCR_IMAGE:${{ steps.tag.outputs.version }}"

      - name: Run smoke script
        run: |
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}/tests/integration/scripts/docker-smoke.sh:/smoke.sh:ro" \
            -e PGHOST=127.0.0.1 \
            -e PGPORT=${{ env.BASIN_PORT }} \
            -e PGUSER=basin \
            -e PGDATABASE=basin \
            postgres:16 \
            bash /smoke.sh

      - name: Dump Basin logs on failure
        if: failure()
        run: docker logs basin-smoke || true

      - name: Stop Basin smoke container
        if: always()
        run: docker rm -f basin-smoke || true

      # ── cosign keyless signing (GHCR image) ────────────────────────────────
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign GHCR image
        run: |
          cosign sign --yes \
            "$GHCR_IMAGE@${{ steps.build.outputs.digest }}"

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Mirror to Docker Hub
  # ──────────────────────────────────────────────────────────────────────────
  mirror-dockerhub:
    name: Mirror to Docker Hub
    needs: build-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (pull source)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (push destination)
        if: ${{ env.DHUB_USER != '' }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check if stable release
        id: stable
        run: |
          version="${{ needs.build-publish.outputs.version }}"
          if [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Docker metadata (Docker Hub)
        if: ${{ env.DHUB_USER != '' }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.build-publish.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.build-publish.outputs.version }}
            type=raw,value=latest,enable=${{ steps.stable.outputs.is_stable }}

      - name: Re-tag and push to Docker Hub
        if: ${{ env.DHUB_USER != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Pull from the GHA cache populated by the build-publish job.
          cache-from: type=gha

      - name: Install cosign
        if: ${{ env.DHUB_USER != '' }}
        uses: sigstore/cosign-installer@v3

      - name: Sign Docker Hub image
        if: ${{ env.DHUB_USER != '' }}
        run: |
          # Resolve the digest for the Docker Hub push so we can sign by digest.
          DHUB_DIGEST=$(docker buildx imagetools inspect \
            "$DHUB_IMAGE:${{ needs.build-publish.outputs.version }}" \
            --format '{{.Manifest.Digest}}')
          cosign sign --yes "$DHUB_IMAGE@${DHUB_DIGEST}"
