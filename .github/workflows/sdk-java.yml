name: sdk-java

# Monorepo port of the old bas-in/basin-java `test` workflow.
on:
  push:
    branches: [main, master]
    paths:
      - "sdks/java/**"
      - ".github/workflows/sdk-java.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "sdks/java/**"
      - ".github/workflows/sdk-java.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: sdks/java

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        java: ["17", "21"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Points Gradle's dependency cache at the SDK's build, not the
          # repo root (which has no Gradle build at all).
          build-root-directory: sdks/java
      - run: gradle test
