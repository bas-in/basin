name: sdk-swift

# Monorepo port of the old basin-swift `test` workflow.
on:
  push:
    branches: [main, master]
    paths:
      - "sdks/swift/**"
      - ".github/workflows/sdk-swift.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "sdks/swift/**"
      - ".github/workflows/sdk-swift.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: sdks/swift

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
