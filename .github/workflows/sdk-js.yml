name: sdk-js

# Monorepo port of the old bas-in/basin-js `test` workflow. Path-filtered so
# an engine or sibling-SDK change doesn't spin up 6 Node matrix legs.
on:
  push:
    branches: [main, master]
    paths:
      - "sdks/js/**"
      - ".github/workflows/sdk-js.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "sdks/js/**"
      - ".github/workflows/sdk-js.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `defaults.run` only applies to `run:` steps — `uses:` steps still resolve
# from the repo root, which is why the setup-node cache key below carries an
# explicit sdks/js path.
defaults:
  run:
    working-directory: sdks/js

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["18", "20", "22"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdks/js/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
