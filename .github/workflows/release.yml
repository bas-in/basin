name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.83.0
  # Strip debug info from release artifacts entirely — saves ~30% of
  # link time and ~50% of artifact size. The default workspace
  # `[profile.release]` keeps `debug = 1` for developers; CI overrides
  # that here so released tarballs don't ship ~hundreds of MB of
  # DWARF the user never reads.
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  # Wrap rustc and cc/c++ through sccache. This is the single biggest
  # release-pipeline win: DuckDB-bundled is ~5-10 min of pure C++
  # compile on every tag and almost nothing about it changes between
  # tags. With sccache hits, the C++ portion drops to seconds.
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  CC: "sccache cc"
  CXX: "sccache c++"
  # The release profile already sets `lto = false` / `codegen-units = 16`
  # in the workspace Cargo.toml — both pro-throughput choices. Don't
  # set RUSTFLAGS=-Clto here; LTO doubles wall-clock for marginal size.

permissions:
  contents: write

jobs:
  # Build prebuilt binaries for the user-facing services (basin-server,
  # basinctl) on each supported target. Library crates live on crates.io;
  # this job only handles GitHub Releases for the binaries.
  #
  # Native runners ONLY — no `cross` / Docker. GitHub's free
  # `ubuntu-24.04-arm` runner for public repos lets us build aarch64
  # Linux natively, sidestepping the DuckDB-bundled cross-compile pain
  # that was timing out the prior cross-based job at ~25 min.
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Targets are picked for coverage + speed:
        #   * x86_64-linux  — the default server target. Always built.
        #   * aarch64-linux — native ARM runner. Fast + free for public
        #     repos; no Docker. Was the failing target under `cross`.
        #   * aarch64-darwin — Apple Silicon. Native macos-latest = arm64.
        # macOS-13 (x86_64 Intel Mac) was dropped: the Intel Mac install
        # base is shrinking fast, the runner-hour cost is high, and
        # users on Intel Macs can still run the Rosetta-translated
        # aarch64 binary or build from source. Re-add when there's
        # user-reported demand.
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      # sccache: C/C++ compile cache, backed by GitHub Actions cache.
      # Most of the release wall-clock is duckdb-bundled compiling ~30
      # MB of C++. Once the cache is warmed (first tag after a duckdb
      # bump), subsequent tags hit ~99% sccache hits on the C++ side.
      - uses: mozilla-actions/sccache-action@v0.0.6
      # Use `lld` on Linux for ~2-3× faster final link. macOS already
      # uses a fast linker by default.
      - name: Install lld (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lld
      - name: Configure rustc to use lld (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p .cargo
          {
            echo "[target.${{ matrix.target }}]"
            echo "linker = \"clang\""
            echo "rustflags = [\"-C\", \"link-arg=-fuse-ld=lld\"]"
          } >> .cargo/config.toml
      # Cache target/ keyed on Cargo.lock + target triple. The C++
      # build artefacts inside target/ (duckdb-sys's `.o` / archives)
      # also survive here, complementing sccache's CC/CXX layer.
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          # Persist the workspace target/ across release tags too, not
          # just within one workflow run.
          save-if: "true"

      # Build only the binary crates. `-p basin-server -p basinctl`
      # avoids compiling test-only deps; `--bins` is implied by the
      # specific package selection.
      - name: Build basin-server + basinctl
        run: cargo build --release --target ${{ matrix.target }} -p basin-server -p basinctl

      - name: Show sccache stats
        run: sccache --show-stats

      - name: Package
        id: package
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          ARCHIVE_DIR="basin-${VERSION}-${{ matrix.target }}"
          mkdir -p "$ARCHIVE_DIR"
          cp target/${{ matrix.target }}/release/basin-server "$ARCHIVE_DIR/"
          cp target/${{ matrix.target }}/release/basinctl "$ARCHIVE_DIR/"
          cp README.md LICENSE CHANGELOG.md "$ARCHIVE_DIR/"
          tar czf "${ARCHIVE_DIR}.tar.gz" "$ARCHIVE_DIR"
          shasum -a 256 "${ARCHIVE_DIR}.tar.gz" > "${ARCHIVE_DIR}.tar.gz.sha256"
          echo "archive=${ARCHIVE_DIR}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=${ARCHIVE_DIR}.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: basin-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          # Pull the section between "## [VERSION]" and the next "## [" header.
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { capture=1; next }
            capture && $0 ~ "^## \\[" { capture=0 }
            capture { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release ${VERSION}" > release_notes.md
            echo "" >> release_notes.md
            echo "(No CHANGELOG entry found — see commit history for changes.)" >> release_notes.md
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
          fail_on_unmatched_files: true
