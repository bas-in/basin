  #   runs-on: ubuntu-latest
  #   needs: [release]
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: dtolnay/rust-toolchain@stable
  #       with:
  #         toolchain: ${{ env.RUST_TOOLCHAIN }}
  #     - run: |
  #         cargo publish -p basin-common
  #         cargo publish -p basin-storage
  #         cargo publish -p basin-catalog
  #         cargo publish -p basin-engine
  #         # ... (publish order matches dep graph topo)
  #       env:
  #         CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
