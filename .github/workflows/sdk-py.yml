name: sdk-py

# New: the Python SDK is the one client that never had CI of its own, so
# nothing has ever gated its 165 tests. Matrix mirrors the versions the
# package already claims support for in pyproject.toml's classifiers.
on:
  push:
    branches: [main, master]
    paths:
      - "sdks/py/**"
      - ".github/workflows/sdk-py.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "sdks/py/**"
      - ".github/workflows/sdk-py.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: sdks/py

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: sdks/py/pyproject.toml
      - run: pip install -e ".[dev,pydantic,realtime]"
      - run: pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sdks/py/pyproject.toml
      - run: pip install -e ".[dev,pydantic,realtime]"
      - run: ruff check .
      # mypy runs with the optional extras installed; src/basin/realtime/ws.py
      # carries a paired import-not-found/unused-ignore suppression so this
      # passes both with and without them.
      - run: mypy src
