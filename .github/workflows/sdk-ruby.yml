name: sdk-ruby

# Monorepo port of the old bas-in/basin-ruby `test` workflow.
on:
  push:
    branches: [main, master]
    paths:
      - "sdks/ruby/**"
      - ".github/workflows/sdk-ruby.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "sdks/ruby/**"
      - ".github/workflows/sdk-ruby.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: sdks/ruby

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.2", "3.3"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          # bundler-cache runs `bundle install` itself, from the repo root
          # unless told otherwise — defaults.run doesn't reach `uses:` steps.
          working-directory: sdks/ruby
      - run: bundle exec rspec
