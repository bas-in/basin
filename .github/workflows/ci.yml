name: CI

# Basic checks on every push and PR: does it build, is it formatted, does it
# lint, do the tests pass, do the docs hold together. Nothing here needs a
# database, a container registry, an object store or a third-party migration
# tool — those live in their own workflows and run on demand.
#
# HOW THIS GOT SMALLER (2026-08-10). CI had nine jobs and six of them were red.
# The failures were almost never the code:
#   - six gates exited before running their check, on a BSD-only `mktemp -t`
#   - the Docker image had never once built (0 successes in 99 runs)
#   - External-Tool Compat had never once passed (0 in 100) — it needs pgwire
#     features Basin has not implemented, which is a roadmap item, not a
#     regression to catch on every push
#   - the `test` job had NEVER COMPLETED in the repository's history, because
#     two tests hang forever and no job had a timeout, so every run sat until
#     GitHub's 6-hour ceiling killed it and reported "cancelled"
# A pipeline that is red by default teaches everyone to ignore it, and then it
# guards nothing. So the checks that pay for themselves on every commit stay
# here, and the heavyweight suites moved to `workflow_dispatch` + a schedule.
# Nothing was deleted: docker-smoke, external-tool-compat and
# tutorial-and-samples are all still runnable, and still run on a timer.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel in-flight runs on the same branch so a quick re-push doesn't queue
# two full builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  # There is deliberately NO toolchain pin here. `rust-toolchain.toml`
  # (channel = "stable") is the single source of truth and rustup honours it
  # over anything a workflow installs — a previous pin installed 1.83.0 and then
  # never used it, so the workspace's real `rust-version` went unverified in
  # both directions. The msrv step below checks that claim directly.
  #
  # Strip debug info from CI dev builds: free runners have ~7GB RAM and these
  # test binaries each statically link ~200 crates, which OOMs the linker on
  # full DWARF. `line-tables-only` keeps file:line for panics and backtraces,
  # which is all CI needs.
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
  # sccache via the GHA cache backend was tried and reverted: the Azure-hosted
  # artifactcache endpoint 400s intermittently, and because RUSTC_WRAPPER
  # propagates to every rustc invocation, every build step fails when the
  # backend is degraded. Swatinem/rust-cache gets most of the benefit without
  # that failure surface.

jobs:
  # ── 1. Does it build, is it clean ──────────────────────────────────────────
  check:
    name: fmt · clippy · msrv
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-check"

      - name: rustfmt
        run: cargo fmt --all -- --check

      # --all-targets matters beyond lint coverage: `basin-integration-tests` is
      # excluded from the test job below (its binaries OOM the runner at link
      # time), so this is the ONLY thing in CI that compiles that crate. Without
      # it a test binary there can stop compiling for weeks unnoticed — which is
      # exactly what happened to a `Wal` fake in August 2026.
      - name: clippy
        run: cargo clippy --workspace --all-targets

      - name: MSRV floor is honest
        run: ./scripts/check-msrv-floor.sh

      # rustdoc warnings are reader-facing bugs, not style: an unresolved
      # `[`Foo`]` renders as plain text, so the reader gets no navigation AND no
      # signal that the target is wrong. The workspace carried 77 of those, plus
      # 73 links into private items (which rustdoc refuses to emit, same blank
      # result), until 2026-08-11. `-D warnings` is what keeps the count at zero;
      # plant a bad link locally and this step exits 101.
      - name: rustdoc links resolve
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --workspace

  # ── 2. Do the tests pass ───────────────────────────────────────────────────
  test:
    name: test
    runs-on: ubuntu-latest
    # A timeout is not a formality here. Without one this job ran to GitHub's
    # 6-hour ceiling on every single attempt in the repo's history, because two
    # tests park forever on the tokio time driver. Those are now #[ignore]d with
    # the reason recorded; this cap makes sure the next hang costs 45 minutes and
    # reports "failed" rather than costing six hours and reporting "cancelled".
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Distinct key from `check` so the larger test-incremental artefact
          # set doesn't evict the clippy cache.
          shared-key: "ci-test"

      # Postgres is optional — basin-catalog's Postgres tests skip on an
      # unreachable server via `try_connect()`. Started best-effort so the bonus
      # coverage runs when it is available.
      - name: Start Postgres
        run: |
          sudo systemctl start postgresql.service || true
          sudo -u postgres psql -c "CREATE USER basin WITH SUPERUSER PASSWORD 'basin';" || true
          sudo -u postgres psql -c "CREATE DATABASE basin OWNER basin;" || true
          echo "DATABASE_URL=postgres://basin:basin@localhost:5432/basin" >> $GITHUB_ENV

      # `cargo test` builds the test artefacts itself, so a separate build step
      # would just double the compile cost. `--locked` catches Cargo.lock drift
      # before anything runs.
      #
      # `--exclude basin-integration-tests`: those are benchmark-flavoured
      # viability cards (viability_*, s3_scaling_*) that link a near-full
      # workspace per binary and OOM a 7GB runner at link time with
      # `ld terminated with signal 7`. They are built for a workstation, not
      # free CI — and clippy above still compiles them.
      - run: cargo test --workspace --exclude basin-integration-tests --no-fail-fast --locked

  # ── 2b. Does Basin still answer like Postgres ──────────────────────────────
  #
  # `differential_pg` runs ~79 queries against BOTH Basin and a live PostgreSQL
  # and compares the results cell by cell. It is the only oracle in the repo
  # that can catch a wrong answer rather than a slow one, and until now it has
  # never run in CI: the job above excludes `basin-integration-tests` wholesale,
  # so nothing set `PG_DIFF_TEST_DSN` and every differential test returned early
  # and reported green.
  #
  # This job runs that ONE test binary rather than the package, which sidesteps
  # the link-time OOM that motivated the exclusion — that is 383 binaries each
  # linking a near-full workspace, not one.
  #
  # It matters most for ADR 0030: the owned query engine is being written to
  # replace DataFusion, and semantic drift is the highest-severity risk in that
  # migration. This is the instrument that detects it.
  conformance:
    name: conformance · differential vs Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-conformance"

      - name: Start Postgres
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD 'postgres';"
          sudo -u postgres psql -c "CREATE DATABASE basin_diff OWNER postgres;"
          echo "PG_DIFF_TEST_DSN=postgres://postgres:postgres@127.0.0.1:5432/basin_diff" >> $GITHUB_ENV

      # FAIL CLOSED. Every differential test returns early — and passes — when
      # the DSN is unset or unreachable, so a broken Postgres would produce a
      # green check that compared nothing. `check-test-executes.sh` cannot catch
      # this one: the tests do execute and do report `ok`, they just assert
      # nothing. So connectivity is asserted here, before the run, where an
      # unreachable server is a job failure rather than a silent skip.
      - name: Postgres is actually reachable
        run: |
          set -euo pipefail
          psql "$PG_DIFF_TEST_DSN" -tAc "select 1" > /dev/null
          echo "oracle reachable: $(psql "$PG_DIFF_TEST_DSN" -tAc 'select version()')"

      # --release because the differential suite seeds and queries real tables;
      # a debug build spends the timeout compiling and scanning rather than
      # comparing.
      # Gates REGRESSIONS, not perfection. Basin diverges from Postgres on a
      # known set of shapes recorded in tests/integration/differential-baseline.txt;
      # a new divergence fails the build, and so does a baseline entry that has
      # started passing, because a baseline nobody prunes becomes an excuse list.
      - name: Differential vs Postgres
        run: bash scripts/check-differential.sh

  # ── 3. Do the docs hold together ───────────────────────────────────────────
  docs:
    name: docs · gate scripts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Frontmatter
        run: ./scripts/check-frontmatter.sh

      - name: Docs index is current
        run: bash ./scripts/build-docs-index.sh --check

      - name: Relative links resolve
        run: ./scripts/check-doc-links.sh

      - name: Shell gates parse
        run: |
          set -euo pipefail
          for f in scripts/verify.sh scripts/check-*.sh scripts/build-docs-index.sh; do
            bash -n "$f"
          done
          echo "ok — every gate script parses"

      # The bug this catches cost six jobs: GNU coreutils requires at least
      # three trailing X's in a mktemp template, so the BSD idiom `mktemp -t
      # name` exits 1 on a Linux runner — before the gate it precedes has run a
      # single check. Every one of those jobs reported failure without ever
      # testing its subject.
      # The match must be anchored to `mktemp`. A bare `-t ` pattern also hits
      # `[ -t 2 ]` — the shell's is-a-terminal test, which verify.sh uses on
      # line 113 to decide whether to colourise. Running this locally before
      # committing is how that false positive was caught; it would have failed
      # the job on a line that has nothing to do with temp files.
      - name: mktemp templates are portable
        run: |
          set -euo pipefail
          hits="$(grep -rn 'mktemp[^|;&]* -t ' --include='*.sh' scripts tests/integration/scripts 2>/dev/null | grep -v 'XXXXXX' || true)"
          if [ -n "${hits}" ]; then
            echo "BSD-only mktemp template (GNU needs XXXXXX):"; echo "${hits}"; exit 1
          fi
          echo "ok — every mktemp template carries an XXXXXX placeholder"

      # Both of these are self-tests: they plant the failure the gate exists to
      # catch and assert it goes red. A gate that has never been shown to fail
      # is not evidence of anything.
      - name: Release verifier discriminates
        run: bash scripts/verify.sh --selftest

      - name: Zero-test guard discriminates
        run: bash scripts/check-test-executes.sh --selftest
