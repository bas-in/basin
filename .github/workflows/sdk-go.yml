name: sdk-go

# Monorepo port of the old bas-in/basin-go `test` workflow.
on:
  push:
    branches: [main, master]
    paths:
      - "sdks/go/**"
      - ".github/workflows/sdk-go.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "sdks/go/**"
      - ".github/workflows/sdk-go.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: sdks/go

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ["1.21", "1.22", "stable"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
          # setup-go looks for go.sum from the repo root, not from
          # defaults.run.working-directory.
          cache-dependency-path: sdks/go/go.sum
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
          cache-dependency-path: sdks/go/go.sum
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: sdks/go
