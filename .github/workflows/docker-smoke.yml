# CI smoke harness for the Basin Docker image (Phase 5.31.A).
#
# The Dockerfile it builds landed long ago, so the old "expected to land red"
# note here is gone. What kept this workflow red instead was a stale toolchain
# pin — `FROM rust:1.85` against a lockfile whose floor is 1.92 —
#
#   error: rustc 1.85.1 is not supported by the following packages:
#     vortex-error@0.71.0 requires rustc 1.91.0
#
# which meant the ONE gate that actually built and ran the server had been
# failing for so long it read as background noise. The Dockerfile now takes a
# RUST_VERSION arg, and ci.yml's `msrv-floor` job fails closed if the declared
# MSRV drifts below the graph again.
#
# This is also where docs/tutorial.md is verified: a Basin container is already
# running here, so tutorial-smoke.sh replays the tutorial's psql steps against
# it rather than paying for a second engine build (it used to live in
# tutorial-and-samples.yml, where there was no server and it asserted nothing).

name: Docker Smoke

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:
  # Weekly, so the arm64 leg that is too slow to emulate on every push still
  # gets exercised. Without this the matrix expression below would quietly mean
  # "arm64 is never built", which is not what dropping it from push is for.
  schedule:
    - cron: "0 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: basin-server
  # pgwire default port
  BASIN_PORT: 5432

jobs:
  build-and-smoke:
    name: Build & smoke (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # amd64 on every push; arm64 only when asked for or on the weekly run.
        #
        # arm64 has no native runner here, so buildx builds it under QEMU
        # emulation — and a full release build of this workspace does not fit in
        # an hour that way. Measured 2026-08-11: the arm64 leg was CANCELLED at
        # the 60-minute cap while amd64 finished its build in 43. Emulated arm64
        # was costing an hour of runner time per push to produce no verdict at
        # all, which is worse than not running it: a job that always ends
        # "cancelled" trains everyone to skip the whole workflow.
        #
        # It still runs — see the schedule and workflow_dispatch above — so an
        # arm64-only break is caught within the week rather than never. Give this
        # a native arm64 runner and it belongs back on every push.
        platform: ${{ github.event_name == 'push' && fromJSON('["linux/amd64"]') || fromJSON('["linux/amd64","linux/arm64"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for cross-platform builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Do not push — load locally for inspection and smoke test.
          # NOTE: multi-arch images cannot be loaded; we load only the current
          # native arch for the smoke step (arm64 runner is not available on
          # free GHA, so linux/arm64 will build but not be loadable here).
          load: ${{ matrix.platform == 'linux/amd64' }}
          push: false
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Size assertion (amd64 only — arm64 can't be loaded on ubuntu-latest) ──
      #
      # The budget is 400 MB, measured, not aspirational. It used to be 100 MB,
      # which this image could never have met: the RELEASE TARBALL for this same
      # target is 101.8 MB *compressed*, so the binaries alone exceed the old
      # limit before debian:bookworm-slim's ~75 MB base is counted. The gate had
      # never run — the image had never built, 0 successes in 99 runs — so
      # nothing ever tested the number against reality.
      #
      # 400 leaves real headroom over the current 325 MB while still catching
      # the regression that actually happened: with debug = 1 inherited from
      # [profile.release], the first image that ever built came out at 1532 MB.
      # Raise this only with a measurement and a reason in the commit.
      - name: Assert image size budget
        if: matrix.platform == 'linux/amd64'
        run: |
          BUDGET_MB=400
          SIZE_BYTES=$(docker image inspect "$IMAGE_NAME:ci" \
            --format '{{.Size}}')
          SIZE_MB=$(( SIZE_BYTES / 1024 / 1024 ))
          echo "Image size: ${SIZE_MB} MB (budget ${BUDGET_MB} MB)"
          if (( SIZE_MB > BUDGET_MB )); then
            echo "ERROR: image exceeds ${BUDGET_MB} MB budget (got ${SIZE_MB} MB)"
            exit 1
          fi

      # ── Quick-start smoke: bring up Basin, wait for pgwire, run round-trip ──
      # Both containers share a user-defined network and talk by container name.
      #
      # This used to publish the port with `-p` and have the psql sidecar reach
      # it over `--network host` at 127.0.0.1. That failed, and failed in the
      # most misleading way available: the server was healthy the whole time —
      # its own log reads `pgwire listener is accept-ready bind=0.0.0.0:5432`
      # six seconds BEFORE the first connection attempt — while the sidecar
      # retried for the full 60 s and reported "Basin did not become ready".
      # The message blamed the server for a reachability problem between two
      # containers.
      #
      # A user-defined network removes the host from the path entirely: docker's
      # embedded DNS resolves `basin-smoke` to the container, so nothing depends
      # on host port publishing or on what loopback means inside a
      # host-networked container. The port is still published for anyone
      # debugging the run from the runner itself.
      - name: Create smoke network
        if: matrix.platform == 'linux/amd64'
        run: docker network create basin-smoke-net

      - name: Start Basin container
        if: matrix.platform == 'linux/amd64'
        run: |
          docker run -d \
            --name basin-smoke \
            --network basin-smoke-net \
            -p "$BASIN_PORT:$BASIN_PORT" \
            "$IMAGE_NAME:ci"

      - name: Run smoke script (via postgres:16 sidecar)
        if: matrix.platform == 'linux/amd64'
        run: |
          docker run --rm \
            --network basin-smoke-net \
            -v "${{ github.workspace }}/tests/integration/scripts/docker-smoke.sh:/smoke.sh:ro" \
            -e PGHOST=basin-smoke \
            -e PGPORT=${{ env.BASIN_PORT }} \
            -e PGUSER=basin \
            -e PGDATABASE=basin \
            postgres:16 \
            bash /smoke.sh

      # Replays docs/tutorial.md's psql steps (schema, RLS policies, and the
      # per-tenant isolation checks under request.jwt.claims) against the same
      # container. Fails closed: unreachable server, missing tutorial, drifted
      # tutorial text, or fewer assertions than expected are all red.
      - name: Verify docs/tutorial.md against the running container
        if: matrix.platform == 'linux/amd64'
        run: |
          docker run --rm \
            --network basin-smoke-net \
            -v "${{ github.workspace }}:/repo:ro" \
            -e PGHOST=basin-smoke \
            -e PGPORT=${{ env.BASIN_PORT }} \
            -e PGUSER=basin \
            -e PGDATABASE=basin \
            postgres:16 \
            bash /repo/tests/integration/scripts/tutorial-smoke.sh

      - name: Dump Basin logs on failure
        if: failure() && matrix.platform == 'linux/amd64'
        run: docker logs basin-smoke || true

      - name: Stop Basin container
        if: always() && matrix.platform == 'linux/amd64'
        run: |
          docker rm -f basin-smoke || true
          # The network holds a reference to the container, so it must go after
          # it — and with || true, because a failed run may never have made it.
          docker network rm basin-smoke-net || true
