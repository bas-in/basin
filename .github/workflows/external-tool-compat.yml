name: External-Tool Compat

# Runs the harnesses that require external binaries (postgresql-client,
# Flyway, golang-migrate) — tools that cannot be installed in the dev
# sandbox.  Triggered on every push/PR to main so regressions are caught
# early without the developer needing a local tool install.
#
# Tasks wired here:
#   5.22.A — pg_dump / psql round-trip  (test: pg_dump_harness)
#   5.25.B — Flyway compat              (test: migration_tool_flyway)
#   5.25.C — golang-migrate compat      (test: migration_tool_golang_migrate)

# NOT on push. This suite has never passed: 0 successes in 100 runs since May.
# It exercises Flyway and golang-migrate against Basin's pgwire, and they fail on
# features Basin has not implemented yet — RowDescription for empty resultsets,
# and advisory locks. That is a roadmap item, not a regression to catch on every
# commit, and a permanently-red required check teaches people to ignore CI.
# Still fully runnable on demand, and it runs weekly so the day it starts
# passing is visible.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  # No RUST_TOOLCHAIN pin: rust-toolchain.toml (channel = "stable") overrides
  # anything a workflow installs, so the old `RUST_TOOLCHAIN: 1.83.0` named a
  # toolchain no job ever ran on. See the note in ci.yml.
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"

jobs:
  # ── 5.22.A — pg_dump harness ────────────────────────────────────────────────
  # Named for what it verifies. The four round-trip slices do NOT run: they
  # invoke a `basin-cli dump --url ... --table ...` contract the shipped CLI
  # does not offer (binary is `basin`; `dump` takes --project/--format/--file
  # and talks to the control plane). A green tick here means the harness
  # compiles, executes and declines honestly — the wrapper pins the declined
  # count so that cannot quietly change. Do not rename this back to
  # "round-trip" until a round-trip actually happens.
  pg-dump-round-trip:
    name: "5.22.A — pg_dump harness (slices pending a CLI dump contract)"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install postgresql-client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-external-pg-dump"

      - name: Set env vars for pg_dump harness
        run: |
          echo "REAL_PG_URL=postgres://postgres:postgres@localhost:5432/postgres" >> $GITHUB_ENV
          # BASIN_LOCAL_URL is not set here; the Basin-round-trip slices
          # will skip cleanly (require_env() prints a notice and returns).

      # NOT a bare `cargo test`, and NOT `-- --ignored`. `--ignored` runs only
      # `#[ignore]`d tests; nothing in this harness is ignored, so that flag
      # made this job report `0 passed; 4 filtered out` — green, zero tests —
      # on every push since the workflow landed. The wrapper fails closed when
      # no test executes and when the number of slices that decline for want of
      # a database URL drifts from the committed baseline.
      - name: Run pg_dump harness (fail-closed wrapper)
        run: ./scripts/check-pg-dump-harness.sh

  # ── 5.25.B — Flyway compat ─────────────────────────────────────────────────
  flyway-compat:
    name: "5.25.B — Flyway compat"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Flyway
        run: |
          wget -qO- \
            https://download.red-gate.com/maven/release/com/redgate/flyway/flyway-commandline/10.21.0/flyway-commandline-10.21.0-linux-x64.tar.gz \
            | tar xz -C /opt
          # The archive unpacks as flyway-10.21.0/
          echo "/opt/flyway-10.21.0" >> $GITHUB_PATH

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-external-flyway"

      # `--ignored` IS correct here: flyway_migrate_10_migrations carries
      # #[ignore] (migration_tool_flyway.rs:112), so this opts it in. The
      # wrapper is what makes that verifiable — it fails closed on a zero-test
      # run, and on the harness's own runtime SKIP, which fires when `flyway`
      # is not on PATH. Without it, an install step that silently produced no
      # usable binary would still be green: the test runs, prints
      # "[flyway_migrate_10_migrations] SKIP", returns, and passes.
      - name: Run Flyway compat harness (fail-closed wrapper)
        run: |
          ./scripts/check-test-executes.sh "5.25.B Flyway" -- \
            -p basin-integration-tests \
            --test migration_tool_flyway \
            -- --ignored --nocapture

  # ── 5.25.C — golang-migrate compat ─────────────────────────────────────────
  golang-migrate-compat:
    name: "5.25.C — golang-migrate compat"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install golang-migrate
        run: |
          curl -sSL \
            https://github.com/golang-migrate/migrate/releases/download/v4.18.1/migrate.linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin migrate
          migrate -version

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-external-golang-migrate"

      # As above: #[ignore]d test opted in with --ignored, wrapped so that a
      # zero-test run or the harness's "migrate not on PATH" SKIP is red.
      - name: Run golang-migrate compat harness (fail-closed wrapper)
        run: |
          ./scripts/check-test-executes.sh "5.25.C golang-migrate" -- \
            -p basin-integration-tests \
            --test migration_tool_golang_migrate \
            -- --ignored --nocapture
