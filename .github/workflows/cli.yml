name: cli

# Monorepo port of the old bas-in/basin-cli `test` workflow. cli/ is a
# standalone crate (its own empty [workspace] table), so cargo here resolves
# against cli/Cargo.toml, not the engine workspace at the repo root.
on:
  push:
    branches: [main, master]
    paths:
      - "cli/**"
      - ".github/workflows/cli.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "cli/**"
      - ".github/workflows/cli.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: cli

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings
      - run: cargo build --locked
      - run: cargo test --locked
