name: sdk-rust

# Monorepo port of the old bas-in/basin-rust `test` workflow. sdks/rust is a
# standalone crate (its own empty [workspace] table), so cargo here resolves
# against sdks/rust/Cargo.toml, not the engine workspace at the repo root.
on:
  push:
    branches: [main, master]
    paths:
      - "sdks/rust/**"
      - ".github/workflows/sdk-rust.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "sdks/rust/**"
      - ".github/workflows/sdk-rust.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: sdks/rust

jobs:
  check:
    name: fmt + clippy + build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # `workspaces` is repo-root-relative and keeps this cache separate from
      # the engine's, so the two never invalidate each other.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdks/rust

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: build
        run: cargo build

      - name: test
        run: cargo test

  all-features:
    name: build + test (all features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdks/rust

      - name: clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: build (all features)
        run: cargo build --all-features

      - name: test (all features)
        run: cargo test --all-features
