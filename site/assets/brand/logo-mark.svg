<svg width="240" height="240" viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Basin">
  <!-- The basin mark: an ellipse rim over a curved vessel, with the
       sediment dot resting at the bottom. Stroke colour is the paper
       tone so the mark sits on the ink background; use logo-mark-ink.svg
       on light surfaces. -->
  <g transform="translate(340, 340)" fill="none" stroke="#FAF7F0" stroke-width="44" stroke-linecap="round">
    <ellipse cx="0" cy="-110" rx="200" ry="44"/>
    <path d="M -200 -110 Q -200 160, 0 160 Q 200 160, 200 -110"/>
    <circle cx="0" cy="40" r="32" fill="#3B6F73" stroke="none"/>
  </g>
</svg>
