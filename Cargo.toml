[workspace]
resolver = "2"
members = [
    "crates/basin-common",
    "crates/basin-storage",
    "crates/basin-catalog",
    "crates/basin-engine",
    "crates/basin-fn",
    "crates/basin-cron",
    "crates/basin-wal",
    "crates/basin-shard",
    "crates/basin-router",
    "crates/basin-placement",
    "crates/basin-vector",
    "crates/basin-pool",
    "crates/basin-auth",
    "crates/basin-rest",
    "crates/basin-net",
    "crates/basin-webhooks",
    "crates/basin-realtime",
    "crates/basin-cv",
    "crates/basin-geo",
    "crates/basin-trgm",
    "crates/basin-iceberg-rest",
    "crates/basin-sketch",
    "crates/basin-hottier",
    "crates/basin-blob",
    "crates/basin-bench-harness",
    "crates/basin-autoscale",
    "services/basin-autoscale",
    "services/basin-server",
    "services/basin-e2e-runner",
    "services/basinctl",
    "tests/integration",
]

[workspace.package]
version = "0.1.9"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# Internal
basin-common = { path = "crates/basin-common" }
basin-fn = { path = "crates/basin-fn" }
basin-storage = { path = "crates/basin-storage" }
basin-catalog = { path = "crates/basin-catalog" }
basin-wal = { path = "crates/basin-wal" }
basin-shard = { path = "crates/basin-shard" }
basin-router = { path = "crates/basin-router" }
basin-placement = { path = "crates/basin-placement" }
basin-engine = { path = "crates/basin-engine" }
# Phase 5.14.B1 lock-in (2026-05-19) — hoisted HLL + t-digest types.
# Depended on by basin-storage (writer-side sketch computation, B2)
# AND basin-engine (query-time merge fast path, B5).  See
# docs/decisions/0017-query-shape-privacy.md and TASK.md 5.14.B1.
basin-sketch = { path = "crates/basin-sketch" }
basin-hottier = { path = "crates/basin-hottier" }
basin-cron = { path = "crates/basin-cron" }
basin-vector = { path = "crates/basin-vector" }
basin-pool = { path = "crates/basin-pool" }
basin-auth = { path = "crates/basin-auth" }
basin-rest = { path = "crates/basin-rest" }
basin-net = { path = "crates/basin-net" }
basin-webhooks = { path = "crates/basin-webhooks" }
basin-realtime = { path = "crates/basin-realtime" }
basin-cv = { path = "crates/basin-cv" }
basin-geo = { path = "crates/basin-geo" }
basin-trgm = { path = "crates/basin-trgm" }
basin-iceberg-rest = { path = "crates/basin-iceberg-rest" }
basin-blob = { path = "crates/basin-blob" }
basin-bench-harness = { path = "crates/basin-bench-harness" }
basin-autoscale = { path = "crates/basin-autoscale" }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
bytes = "1"

# Arrow / Parquet
arrow = "58"
arrow-array = "58"
arrow-schema = { version = "58", features = ["serde"] }
arrow-select = "58"
parquet = { version = "58", features = ["async", "object_store"] }
object_store = { version = "0.13", features = ["aws", "gcp", "http"] }

# Errors / logs
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.28"
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = "0.27"

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SIMD-accelerated JSON parser used in `coerce_jsonb` (bulk INSERT hot path).
# Sonic-rs parses straight into `serde_json::Value` so canonicalisation
# (BTreeMap key-sort) stays unchanged. Only the parse + serialise legs swap.
sonic-rs = "0.3"

# IDs / time
ulid = { version = "1", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# SQL engine + pgwire
datafusion = "53"
pgwire = "0.28"
sqlparser = "0.61"

# Compact binary serialisation, used for the HNSW index segment format.
bincode = "1.3"

# R-tree spatial index for PostGIS-shape GIST indexes. 0.12 with `serde` for
# bincode round-trip of segment sidecars; one new transitive dep (num-traits,
# already in arrow). See docs/postgis-rtree-design.md §6.
rstar = { version = "0.12", features = ["serde"] }

# Pure-Rust geometry algorithms backing the PG-Wave 3 ST_* predicate library.
# MIT/Apache dual-licence. `default-features = false` drops the optional
# spatial-index features (rstar, spade) that basin manages itself.
# Pinned to 0.33 across the workspace (was previously dual-pinned at 0.28
# in workspace deps + 0.33 in basin-geo's local Cargo.toml, causing a
# duplicate-version compile). 0.33 keeps the same `Intersects` / `Within`
# trait surface basin-engine::geo_glue uses against POINT × POINT; the
# topology trait signatures are unchanged 0.28 → 0.33.
geo = { version = "0.33", default-features = false }

# Pure-Rust PROJ4 implementation. Powers `ST_Transform` and the
# `basin_geo::transform` module. Zero native deps — no libproj system
# package required on the Fly.io build image. Supports the
# PROJ4-string-representable SRID universe (UTM, Lambert Conformal,
# Mercator, Albers, Web Mercator, common national grids, WGS84/NAD83).
# Does NOT support NTv2 / NADCON datum-shift grids — documented.
proj4rs = "0.1"

# Bounded LRU caches: parquet footer metadata in basin-storage::reader and
# parsed HNSW segments in basin-storage::vector_index. Keeps hot reads off
# the metadata round-trip / re-parse path.
lru = "0.12"

# High-performance allocator. Plugged in as the global allocator inside
# basin-server; allocator-heavy paths (Parquet decode, JSON encode, Arrow
# batch construction) benefit measurably under load.
mimalloc = { version = "0.1", default-features = false }

# Auth + REST stack. lettre for SMTP, jsonwebtoken for JWT issue/verify,
# bcrypt for password hashing, governor for rate-limiting, axum for the
# HTTP layer. Keep these versions pinned at workspace level so basin-auth
# and basin-rest agree on the JWT/HTTP types they pass between each other.
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder", "hostname"] }
jsonwebtoken = "9"
bcrypt = "0.16"
governor = "0.7"
axum = { version = "0.7", features = ["json", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
http = "1"
hyper = "1"

# Hashing + encoding for the Postgres `digest()` / `encode()` / `decode()`
# UDF family (see `basin_engine::udf`). All `digest 0.10`-shaped so they
# compose through one trait. `hex` and `base64` carry the encode/decode
# string formats the corresponding pgcrypto functions emit.
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
base64 = "0.22"

# Test
tempfile = "3"
tokio-test = "0.4"
proptest = "1"
tokio-postgres = "0.7"
# CLI argument parsing for `services/basinctl`. `derive` keeps the
# subcommand surface declarative; default features only — no color crate
# pulled into release builds we don't need for a small admin tool.
clap = { version = "4", features = ["derive"] }
# PRNG for benchmark workloads. Kept at workspace level so every test
# crate that wants reproducible random ids points at the same major
# version (0.8.x). Bumping to 0.9 changes `gen_range` semantics, which
# would invalidate every published cold-p99 baseline.
rand = "0.8"
# Regex engine used by regexp_match / regexp_split_to_array UDFs in basin-engine.
regex = "1"
# Snowball stemming for FTS (to_tsvector English stemmer). Phase 5.20.C.
rust-stemmers = "1.2"
# HTTP client for net.http_get / net.http_post UDFs (basin-engine) and the
# basin-net crate. Pinned at 0.12 (rustls-tls, no native-tls, json support).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Phase 5.16.A lock-in (2026-05-19, ADR 0017).  Cross-process / cross-
# Rust-version stable 64-bit hash function used by QueryShape.  Seeded
# with the fixed BASIN_QUERY_SHAPE_SEED constant.  Rejected
# std::DefaultHasher (unstable across Rust versions) and fnv1a-64
# (too weak at cloud-scale).
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# HMAC-SHA256 for signing OAuth state tokens (Phase 5.10.O).
hmac = "0.12"
# Constant-time comparison (used by basin-rest auth for HMAC verification).
subtle = "2"
# Test-config file parsing for tests/integration/src/test_config.rs.
# Tiny, well-maintained, default features off to keep build minimal.
toml = { version = "0.8", default-features = false, features = ["parse"] }
# Real PostgreSQL 16 parser (libpg_query vendored). Used by ADR 0014 Phase 1
# to parse and classify every incoming statement before sqlparser sees it.
pg_query = "6"

[profile.release]
lto = false
codegen-units = 16
debug = 1

# Per-package, NOT global: deps keep debug=1 so their sccache entries stay
# warm (a global debug change cold-rebuilds the whole DataFusion tree).
# Only the ~30 integration test binaries drop debuginfo → fast link.
# opt-level inherits 3, so measured benchmark numbers are unaffected.
[profile.release.package.basin-integration-tests]
debug = 0
strip = true

# Same per-package trick for dev/test: each integration test compiles to its
# own statically-linked binary including the full workspace dep tree. With
# cargo's default `debug = 2`, each is ~426 MB; ~80 binaries = ~34 GB of
# duplicated debug symbols on disk. Dropping to line-tables-only (`debug = 1`)
# keeps stack-trace file:line for test failures but loses the variable-
# inspection sections, shrinking each binary to ~80-150 MB.
[profile.dev.package.basin-integration-tests]
debug = 1

[profile.bench]
lto = "thin"

# bench-fast: faster bench-build profile for benchmark/run/_setup.sh.
# Inherits from release so deps (DataFusion/Arrow/tokio/…) stay byte-identical
# to release (opt-3, valid bench measurement). Only basin-integration-tests
# gets cheaper codegen below (the 81-binary blowup).
[profile.bench-fast]
inherits = "release"

# Per-package overrides — ONLY basin-integration-tests gets cheaper codegen.
[profile.bench-fast.package.basin-integration-tests]
opt-level = 2
codegen-units = 256
debug = 0
strip = "symbols"
incremental = false

