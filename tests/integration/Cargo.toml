[package]
name = "basin-integration-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
basin-common.workspace = true
basin-storage.workspace = true
basin-catalog.workspace = true
basin-engine.workspace = true
basin-hottier.workspace = true
basin-cron.workspace = true
basin-net.workspace = true
basin-cv.workspace = true
basin-geo.workspace = true
basin-trgm.workspace = true
basin-router.workspace = true
basin-vector.workspace = true
basin-shard.workspace = true
basin-wal.workspace = true
basin-auth = { workspace = true, features = ["test-utils"] }
basin-pool.workspace = true
basin-rest.workspace = true
basin-blob.workspace = true
basin-realtime.workspace = true

tokio.workspace = true
futures.workspace = true
bytes.workspace = true
arrow.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
chrono.workspace = true
object_store.workspace = true
tempfile.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
ulid.workspace = true
# OAuth flow integration tests need axum for the mock provider HTTP server.
axum.workspace = true
base64.workspace = true
sha2.workspace = true
# Phase 5.10.M: MFA TOTP integration tests compute TOTP codes in-test.
hmac.workspace = true
sha1.workspace = true
base32 = "0.4"
# Phase 6.SEC.P0.3: inbound webhook auth tests hex-encode HMAC-SHA256 sigs.
hex.workspace = true

[dev-dependencies]
serial_test = "3"
# `with-uuid-1` + `with-serde_json-1` enable native binary encoding of
# `Uuid` and `serde_json::Value` so the JSONB/UUID parameter-binding
# integration test can exercise the binary wire format end-to-end.
tokio-postgres = { workspace = true, features = ["with-uuid-1", "with-serde_json-1"] }
walkdir = "2"
async-trait.workspace = true
anyhow.workspace = true
bcrypt.workspace = true
ulid.workspace = true
uuid.workspace = true
# Phase 5.11.J: wasm_udf integration test needs to compile WAT bytes and
# base64-encode them before passing them to CREATE FUNCTION … LANGUAGE wasm.
# `wat` is already a transitive dep of `wasmtime` (enabled by default).
wat = "1"
# Phase 6.SEC.P0.2: WebAuthn integration tests drive a software P-256
# authenticator that produces real attestation/assertion blobs.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
ciborium = "0.2"
rand_core = "0.6"
base64.workspace = true
# Phase 5.11.W6: fn_javascript test exercises the basin-fn host trait
# (FunctionHost / QueryExecutor) against a real engine session to verify
# auth.uid() resolves to the caller's JWT sub inside a function.
basin-fn.workspace = true
# Phase 5.27.A: txn-mode pool benchmark.
criterion = { version = "0.5", features = ["html_reports"] }

[lib]
path = "src/lib.rs"

# Phase 5.27.A: txn-mode pool throughput / latency benchmark.
[[bench]]
name = "pool_transaction_mode"
harness = false
